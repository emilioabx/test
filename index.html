<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Gradient HSL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
        }

        .preview {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .controls {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #808080;
            text-transform: uppercase;
        }

        .hsl-inputs {
            display: flex;
            gap: 0.5rem;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .input-label {
            font-size: 0.7rem;
            color: #808080;
            text-align: center;
        }

        input[type="number"] {
            width: 60px;
            padding: 0.4rem 0.3rem;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.875rem;
            outline: none;
            text-align: center;
        }

        input[type="number"]:focus {
            border-color: #666;
        }

        .angle-input {
            width: 70px;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            color: #808080;
            font-size: 0.75rem;
            border-top: 1px solid #2a2a2a;
        }

        .css-output {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
        }

        .css-code {
            font-family: 'Courier New', monospace;
            font-size: 0.813rem;
            color: #a0d0ff;
            word-break: break-all;
            line-height: 1.5;
        }

        .copy-btn {
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .copy-btn:hover {
            background: #4a4a4a;
            border-color: #666;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HSL Gradient Generator</h1>

        <div class="preview" id="preview"></div>

        <div class="controls">
            <div class="control-group">
                <label>From</label>
                <div class="hsl-inputs">
                    <div class="input-wrapper">
                        <span class="input-label">H</span>
                        <input type="number" id="fromH" min="0" max="360" value="0">
                    </div>
                    <div class="input-wrapper">
                        <span class="input-label">S</span>
                        <input type="number" id="fromS" min="0" max="100" value="100">
                    </div>
                    <div class="input-wrapper">
                        <span class="input-label">L</span>
                        <input type="number" id="fromL" min="0" max="100" value="50">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>To</label>
                <div class="hsl-inputs">
                    <div class="input-wrapper">
                        <span class="input-label">H</span>
                        <input type="number" id="toH" min="0" max="360" value="240">
                    </div>
                    <div class="input-wrapper">
                        <span class="input-label">S</span>
                        <input type="number" id="toS" min="0" max="100" value="100">
                    </div>
                    <div class="input-wrapper">
                        <span class="input-label">L</span>
                        <input type="number" id="toL" min="0" max="100" value="50">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Angle</label>
                <div class="input-wrapper">
                    <span class="input-label">°</span>
                    <input type="number" id="angle" min="0" max="360" value="90" class="angle-input">
                </div>
            </div>
        </div>

        <div class="css-output">
            <div class="css-code" id="cssCode"></div>
            <button class="copy-btn" id="copyBtn">Copier le CSS</button>
        </div>

        <footer>© Tiny Platforms Limited 2026</footer>
    </div>

    <script>
        // Elements
        const preview = document.getElementById('preview');
        const cssCode = document.getElementById('cssCode');
        const copyBtn = document.getElementById('copyBtn');

        // From color inputs
        const fromH = document.getElementById('fromH');
        const fromS = document.getElementById('fromS');
        const fromL = document.getElementById('fromL');

        // To color inputs
        const toH = document.getElementById('toH');
        const toS = document.getElementById('toS');
        const toL = document.getElementById('toL');

        // Angle input
        const angle = document.getElementById('angle');

        // Update gradient
        function updateGradient() {
            const fromColor = `hsl(${fromH.value}, ${fromS.value}%, ${fromL.value}%)`;
            const toColor = `hsl(${toH.value}, ${toS.value}%, ${toL.value}%)`;
            const gradientAngle = angle.value;

            const gradient = `linear-gradient(${gradientAngle}deg, ${fromColor}, ${toColor})`;
            preview.style.background = gradient;
            cssCode.textContent = `background: ${gradient};`;
        }

        // Event listeners
        fromH.addEventListener('input', updateGradient);
        fromS.addEventListener('input', updateGradient);
        fromL.addEventListener('input', updateGradient);
        toH.addEventListener('input', updateGradient);
        toS.addEventListener('input', updateGradient);
        toL.addEventListener('input', updateGradient);
        angle.addEventListener('input', updateGradient);

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(cssCode.textContent).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copié !';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        });

        // Initial update
        updateGradient();
    </script>
</body>
</html>
