<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Gradient HSL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
        }

        .preview {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .controls {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #808080;
            text-transform: uppercase;
        }

        .hsl-inputs {
            display: flex;
            gap: 0.5rem;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .input-label {
            font-size: 0.7rem;
            color: #808080;
            text-align: center;
        }

        input[type="number"] {
            width: 60px;
            padding: 0.4rem 0.3rem;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.875rem;
            outline: none;
            text-align: center;
        }

        input[type="number"]:focus {
            border-color: #666;
        }

        .angle-input {
            width: 70px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #3a3a3a;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #e0e0e0;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #e0e0e0;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .slider-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .slider-label {
            font-size: 0.75rem;
            color: #808080;
            min-width: 20px;
        }

        .slider-value {
            font-size: 0.75rem;
            color: #fff;
            min-width: 35px;
            text-align: right;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 1rem;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #808080;
            font-size: 0.875rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }

        .tab.active {
            background: #3a3a3a;
            border-color: #666;
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            color: #808080;
            font-size: 0.75rem;
            border-top: 1px solid #2a2a2a;
        }

        .css-output {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
        }

        .css-code {
            font-family: 'Courier New', monospace;
            font-size: 0.813rem;
            color: #a0d0ff;
            word-break: break-all;
            line-height: 1.5;
        }

        .copy-btn {
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .copy-btn:hover {
            background: #4a4a4a;
            border-color: #666;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HSL Gradient Generator</h1>

        <div class="tabs">
            <div class="tab active" data-tab="fromto">From / To</div>
            <div class="tab" data-tab="delta">Delta</div>
        </div>

        <div class="preview" id="preview"></div>

        <!-- From/To Mode -->
        <div class="tab-content active" id="fromto-content">
            <div class="controls">
                <div class="control-group">
                    <label>From</label>
                    <div class="hsl-inputs">
                        <div class="input-wrapper">
                            <span class="input-label">H</span>
                            <input type="number" id="fromH" min="0" max="360" value="0">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">S</span>
                            <input type="number" id="fromS" min="0" max="100" value="100">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">L</span>
                            <input type="number" id="fromL" min="0" max="100" value="50">
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>To</label>
                    <div class="hsl-inputs">
                        <div class="input-wrapper">
                            <span class="input-label">H</span>
                            <input type="number" id="toH" min="0" max="360" value="240">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">S</span>
                            <input type="number" id="toS" min="0" max="100" value="100">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">L</span>
                            <input type="number" id="toL" min="0" max="100" value="50">
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>Angle</label>
                    <div class="input-wrapper">
                        <span class="input-label">°</span>
                        <input type="number" id="angle" min="0" max="360" value="90" class="angle-input">
                    </div>
                </div>
            </div>
        </div>

        <!-- Delta Mode -->
        <div class="tab-content" id="delta-content">
            <div class="controls">
                <div class="control-group">
                    <label>Base</label>
                    <div class="slider-wrapper">
                        <div class="slider-item">
                            <span class="slider-label">H</span>
                            <input type="range" id="baseH" min="0" max="360" value="30">
                            <span class="slider-value" id="baseH-val">30</span>
                        </div>
                        <div class="slider-item">
                            <span class="slider-label">S</span>
                            <input type="range" id="baseS" min="0" max="100" value="50">
                            <span class="slider-value" id="baseS-val">50</span>
                        </div>
                        <div class="slider-item">
                            <span class="slider-label">L</span>
                            <input type="range" id="baseL" min="0" max="100" value="60">
                            <span class="slider-value" id="baseL-val">60</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>Delta</label>
                    <div class="hsl-inputs">
                        <div class="input-wrapper">
                            <span class="input-label">H Δ</span>
                            <input type="number" id="deltaH" min="0" max="180" value="5">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">S Δ</span>
                            <input type="number" id="deltaS" min="0" max="50" value="3">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">L Δ</span>
                            <input type="number" id="deltaL" min="0" max="50" value="10">
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>Angle</label>
                    <div class="input-wrapper">
                        <span class="input-label">°</span>
                        <input type="number" id="angleDelta" min="0" max="360" value="90" class="angle-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="css-output">
            <div class="css-code" id="cssCode"></div>
            <button class="copy-btn" id="copyBtn">Copier le CSS</button>
        </div>

        <footer>© Tiny Platforms Limited 2026</footer>
    </div>

    <script>
        // Elements
        const preview = document.getElementById('preview');
        const cssCode = document.getElementById('cssCode');
        const copyBtn = document.getElementById('copyBtn');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        // From/To mode inputs
        const fromH = document.getElementById('fromH');
        const fromS = document.getElementById('fromS');
        const fromL = document.getElementById('fromL');
        const toH = document.getElementById('toH');
        const toS = document.getElementById('toS');
        const toL = document.getElementById('toL');
        const angle = document.getElementById('angle');

        // Delta mode inputs
        const baseH = document.getElementById('baseH');
        const baseS = document.getElementById('baseS');
        const baseL = document.getElementById('baseL');
        const baseHVal = document.getElementById('baseH-val');
        const baseSVal = document.getElementById('baseS-val');
        const baseLVal = document.getElementById('baseL-val');
        const deltaH = document.getElementById('deltaH');
        const deltaS = document.getElementById('deltaS');
        const deltaL = document.getElementById('deltaL');
        const angleDelta = document.getElementById('angleDelta');

        // Current mode
        let currentMode = 'fromto';

        // Helper function to clamp values
        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        // Update gradient for From/To mode
        function updateFromToGradient() {
            const fromColor = `hsl(${fromH.value}, ${fromS.value}%, ${fromL.value}%)`;
            const toColor = `hsl(${toH.value}, ${toS.value}%, ${toL.value}%)`;
            const gradientAngle = angle.value;

            const gradient = `linear-gradient(${gradientAngle}deg, ${fromColor}, ${toColor})`;
            preview.style.background = gradient;
            cssCode.textContent = `background: ${gradient};`;
        }

        // Update gradient for Delta mode
        function updateDeltaGradient() {
            const baseHValue = parseInt(baseH.value);
            const baseSValue = parseInt(baseS.value);
            const baseLValue = parseInt(baseL.value);
            const deltaHVal = parseInt(deltaH.value);
            const deltaSVal = parseInt(deltaS.value);
            const deltaLVal = parseInt(deltaL.value);
            const gradientAngle = angleDelta.value;

            // Update value displays
            baseHVal.textContent = baseHValue;
            baseSVal.textContent = baseSValue;
            baseLVal.textContent = baseLValue;

            // Calculate color 1: base - delta
            const color1H = clamp(baseHValue - deltaHVal, 0, 360);
            const color1S = clamp(baseSValue - deltaSVal, 0, 100);
            const color1L = clamp(baseLValue - deltaLVal, 0, 100);

            // Calculate color 2: base + delta
            const color2H = clamp(baseHValue + deltaHVal, 0, 360);
            const color2S = clamp(baseSValue + deltaSVal, 0, 100);
            const color2L = clamp(baseLValue + deltaLVal, 0, 100);

            const color1 = `hsl(${color1H}, ${color1S}%, ${color1L}%)`;
            const color2 = `hsl(${color2H}, ${color2S}%, ${color2L}%)`;

            const gradient = `linear-gradient(${gradientAngle}deg, ${color1}, ${color2})`;
            preview.style.background = gradient;
            cssCode.textContent = `background: ${gradient};`;
        }

        // Update gradient based on current mode
        function updateGradient() {
            if (currentMode === 'fromto') {
                updateFromToGradient();
            } else {
                updateDeltaGradient();
            }
        }

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.getAttribute('data-tab');

                // Update active tab
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update active content
                tabContents.forEach(content => {
                    if (content.id === `${tabName}-content`) {
                        content.classList.add('active');
                    } else {
                        content.classList.remove('active');
                    }
                });

                // Update current mode
                currentMode = tabName;

                // Update gradient
                updateGradient();
            });
        });

        // Event listeners for From/To mode
        fromH.addEventListener('input', updateGradient);
        fromS.addEventListener('input', updateGradient);
        fromL.addEventListener('input', updateGradient);
        toH.addEventListener('input', updateGradient);
        toS.addEventListener('input', updateGradient);
        toL.addEventListener('input', updateGradient);
        angle.addEventListener('input', updateGradient);

        // Event listeners for Delta mode
        baseH.addEventListener('input', updateGradient);
        baseS.addEventListener('input', updateGradient);
        baseL.addEventListener('input', updateGradient);
        deltaH.addEventListener('input', updateGradient);
        deltaS.addEventListener('input', updateGradient);
        deltaL.addEventListener('input', updateGradient);
        angleDelta.addEventListener('input', updateGradient);

        // Preview click/hold to show base color in Delta mode
        function showBaseColor() {
            if (currentMode === 'delta') {
                const baseColor = `hsl(${baseH.value}, ${baseS.value}%, ${baseL.value}%)`;
                preview.style.background = baseColor;
            }
        }

        function showGradient() {
            if (currentMode === 'delta') {
                updateGradient();
            }
        }

        // Mouse events
        preview.addEventListener('mousedown', showBaseColor);
        preview.addEventListener('mouseup', showGradient);
        preview.addEventListener('mouseleave', showGradient);

        // Touch events for iPad/mobile
        preview.addEventListener('touchstart', (e) => {
            e.preventDefault();
            showBaseColor();
        });
        preview.addEventListener('touchend', (e) => {
            e.preventDefault();
            showGradient();
        });

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(cssCode.textContent).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copié !';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        });

        // Initial update
        updateGradient();
    </script>
</body>
</html>
